# The load test against a copy of production: the prod profile, two backend instances behind Caddy over HTTPS, Redis
# holding the rate limits they share, and the rate limits on. Everything runs on a private network with no published
# ports, so it never touches the development database. From the repository root:
#   bash loadtest/production/prepare.sh
#   docker compose -f loadtest/production/docker-compose.yml up --build --detach --wait web
#   docker compose -f loadtest/production/docker-compose.yml run --rm k6
#   docker compose -f loadtest/production/docker-compose.yml down -v
# k6's full summary lands in loadtest/results/production-summary.json.
name: supportchat-production-test

x-backend: &backend
  image: supportchat-production-test-backend
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    SPRING_PROFILES_ACTIVE: prod
    DB_URL: jdbc:postgresql://db:5432/supportchat
    DB_OWNER_USER: supportchat_owner
    DB_OWNER_PASSWORD: test-owner-password
    DB_APP_USER: supportchat_app
    DB_APP_PASSWORD: test-app-password
    DB_POOL_SIZE: "20"
    JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt-private.pem
    JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
    CORS_ALLOWED_ORIGINS: https://web
    # A throwaway key for this environment only
    SECRETS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    PANEL_URL: https://web
    LEGAL_CONTACT_EMAIL: privacidad@example.test
    BILLING_RETURN_URL: https://web/billing
    RATE_LIMIT_STORE: redis
    REDIS_URL: redis://redis:6379
    # The offline model and hashing embeddings: the run measures the platform, not Anthropic's or Voyage's latency
    CHAT_MODEL_PROVIDER: offline
    EMBEDDING_PROVIDER: hashing
    DEPLOYMENT_ENVIRONMENT: production-test
    # One workspace answers every virtual visitor: the free plan's 100 answers a month would stop the run at once
    SPRING_APPLICATION_JSON: >-
      {"supportchat":{"billing":{"plans":{"FREE":{"included":{"ANSWERS":100000000}}}}}}
  secrets:
    - jwt-private.pem
    - jwt-public.pem
  healthcheck:
    test:
      - CMD
      - bash
      - -c
      - exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q '"UP"' <&3
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 40s
  mem_limit: 2g

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: supportchat
      POSTGRES_USER: supportchat_owner
      POSTGRES_PASSWORD: test-owner-password
      DB_APP_USER: supportchat_app
      DB_APP_PASSWORD: test-app-password
    # Production's settings, so two pools of 20 fit as they would on the VM
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "work_mem=16MB", "-c", "max_connections=60"]
    shm_size: 256mb
    volumes:
      - ../../deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportchat_owner -d supportchat"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Built once; the second instance runs the same image
  backend-a:
    <<: *backend
    build: ../../backend

  backend-b:
    <<: *backend
    depends_on:
      backend-a:
        condition: service_healthy

  web:
    image: caddy:2.10-alpine
    depends_on:
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Started is not listening yet: k6 waits until Caddy accepts connections
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 2s
      timeout: 2s
      retries: 15

  k6:
    image: grafana/k6:1.3.0
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: https://web
      PEAK_RATE: ${PEAK_RATE:-10}
      HOLD: ${HOLD:-3m}
    command: ["run", "/scripts/production.js"]
    volumes:
      - ./production.js:/scripts/production.js:ro
      - ../results:/results

secrets:
  jwt-private.pem:
    file: ./secrets/jwt-private.pem
  jwt-public.pem:
    file: ./secrets/jwt-public.pem
