# What the owner reads in the WhatsApp alerts and, when one did not arrive, in the panel. Owners use the panel in
# Spanish, so these exist only in Spanish. {} takes the values in order. Texts used as template variables must not
# hold line breaks: WhatsApp refuses them

# Why an alert did not arrive
delivery.no-channel=No hay un número de WhatsApp conectado y activo para enviar los avisos.
delivery.outside-window=WhatsApp no lo entregó: ese número no le ha escrito al negocio en las últimas 24 horas. Escríbele una vez desde ese número o configura una plantilla aprobada.
delivery.template-refused=WhatsApp rechazó la plantilla: revisa que su nombre y su idioma coincidan con una plantilla aprobada de tres variables.
delivery.unavailable=No se pudo contactar a WhatsApp en ese momento.

