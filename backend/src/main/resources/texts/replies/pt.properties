# What the assistant says itself, in Portuguese: when the knowledge base has no answer, when the model fails, around an
# action the customer confirms, and courtesy replies that need no model. The conversation's language picks the file
no-answer=Não tenho informações suficientes para responder a isso. Quer que eu chame uma pessoa da equipe?
failure=Desculpe, não consegui responder agora. Tente novamente em alguns minutos.
confirm-prompt=Para continuar, confirme a ação.
done=Pronto, a ação foi concluída.
failed=Desculpe, não consegui concluir a ação agora. Quer que eu chame uma pessoa da equipe?
cancelled=Tudo bem, não fiz nenhuma alteração.
expired=A confirmação expirou e não fiz nenhuma alteração. Se ainda precisar, é só pedir de novo.
greeting=Olá! 👋 Como posso ajudar?
thanks=Por nada! Se precisar de mais alguma coisa, estou aqui.
goodbye=Até logo! Estarei aqui se precisar de mais alguma coisa.
acknowledged=Perfeito! Se tiver outra pergunta, é só escrever.
