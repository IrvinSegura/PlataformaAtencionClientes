# What the assistant says itself, in Spanish: when the knowledge base has no answer, when the model fails, around an
# action the customer confirms, and courtesy replies that need no model. The conversation's language picks the file
no-answer=No tengo información suficiente para responder eso. ¿Quieres que te comunique con una persona del equipo?
failure=Lo siento, no pude responder en este momento. Inténtalo de nuevo en unos minutos.
confirm-prompt=Para continuar, confirma la acción.
done=Listo, la acción se completó.
failed=Lo siento, no pude completar la acción en este momento. ¿Quieres que te comunique con una persona del equipo?
cancelled=De acuerdo, no hice ningún cambio.
expired=La confirmación caducó y no hice ningún cambio. Si aún lo necesitas, pídemelo de nuevo.
greeting=¡Hola! 👋 ¿En qué te puedo ayudar?
thanks=¡Con gusto! Si necesitas algo más, aquí estoy.
goodbye=¡Hasta pronto! Aquí estaré si necesitas algo más.
acknowledged=¡Perfecto! Si tienes otra pregunta, escríbela cuando quieras.
