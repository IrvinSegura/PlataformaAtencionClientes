# What the assistant says itself, in French: when the knowledge base has no answer, when the model fails, around an
# action the customer confirms, and courtesy replies that need no model. The conversation's language picks the file
no-answer=Je n'ai pas assez d'informations pour répondre à cela. Voulez-vous que je vous mette en contact avec une personne de l'équipe ?
failure=Désolé, je n'ai pas pu répondre pour le moment. Réessayez dans quelques minutes.
confirm-prompt=Pour continuer, confirmez l'action.
done=C'est fait, l'action a été effectuée.
failed=Désolé, je n'ai pas pu effectuer l'action pour le moment. Voulez-vous que je vous mette en contact avec une personne de l'équipe ?
cancelled=D'accord, je n'ai rien modifié.
expired=La confirmation a expiré et je n'ai rien modifié. Si vous en avez encore besoin, demandez-le-moi à nouveau.
greeting=Bonjour ! 👋 Comment puis-je vous aider ?
thanks=Avec plaisir ! Si vous avez besoin d'autre chose, je suis là.
goodbye=À bientôt ! Je serai là si vous avez besoin d'autre chose.
acknowledged=Parfait ! Si vous avez une autre question, écrivez-la quand vous voulez.
