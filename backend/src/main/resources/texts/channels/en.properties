# What WhatsApp, Messenger, Instagram and email messages say besides the reply itself, in English. The widget words
# the same notices in texts/widget. Button labels (confirm, cancel) must fit WhatsApp's 20 characters; {} takes the
# team member's name
sources=Sources
confirm=Confirm
cancel=Cancel
someone=Someone from the team
handoff-requested=We'll put you in touch with someone from the team. Write here and they'll reply as soon as they're available.
handoff-cancelled=All right, let's carry on with the assistant.
joined={} joined the conversation.
left={} left the conversation; the assistant is still with you.
closed=The conversation was closed. If you need anything else, write to us again.
reply-to-confirm=To go ahead, reply to this email with the word CONFIRM. To leave it, reply CANCEL.
subject=Your question
