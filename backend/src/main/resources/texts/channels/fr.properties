# What WhatsApp, Messenger, Instagram and email messages say besides the reply itself, in French. The widget words
# the same notices in texts/widget. Button labels (confirm, cancel) must fit WhatsApp's 20 characters; {} takes the
# team member's name
sources=Sources
confirm=Confirmer
cancel=Annuler
someone=Une personne de l'équipe
handoff-requested=Nous allons vous mettre en contact avec une personne de l'équipe. Écrivez ici et elle vous répondra dès qu'elle sera disponible.
handoff-cancelled=D'accord, nous continuons avec l'assistant.
joined={} a rejoint la conversation.
left={} a quitté la conversation ; l'assistant reste avec vous.
closed=La conversation est terminée. Si vous avez besoin d'autre chose, écrivez-nous à nouveau.
reply-to-confirm=Pour continuer, répondez à cet e-mail avec le mot CONFIRMER. Pour y renoncer, répondez ANNULER.
subject=Votre question
