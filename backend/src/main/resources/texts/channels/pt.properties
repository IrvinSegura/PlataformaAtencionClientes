# What WhatsApp, Messenger, Instagram and email messages say besides the reply itself, in Portuguese. The widget words
# the same notices in texts/widget. Button labels (confirm, cancel) must fit WhatsApp's 20 characters; {} takes the
# team member's name
sources=Fontes
confirm=Confirmar
cancel=Cancelar
someone=Uma pessoa da equipe
handoff-requested=Vamos chamar uma pessoa da equipe. Escreva aqui e ela responderá assim que estiver disponível.
handoff-cancelled=Tudo bem, seguimos com o assistente.
joined={} entrou na conversa.
left={} saiu da conversa; o assistente continua com você.
closed=A conversa foi encerrada. Se precisar de mais alguma coisa, escreva de novo.
reply-to-confirm=Para seguir, responda a este e-mail com a palavra CONFIRMAR. Para desistir, responda CANCELAR.
subject=Sua pergunta
