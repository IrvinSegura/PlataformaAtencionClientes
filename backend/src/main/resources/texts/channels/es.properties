# What WhatsApp, Messenger, Instagram and email messages say besides the reply itself, in Spanish. The widget words
# the same notices in texts/widget. Button labels (confirm, cancel) must fit WhatsApp's 20 characters; {} takes the
# team member's name
sources=Fuentes
confirm=Confirmar
cancel=Cancelar
someone=Una persona del equipo
handoff-requested=Te comunicaremos con una persona del equipo. Escribe aquí y te responderá en cuanto esté disponible.
handoff-cancelled=De acuerdo, seguimos con el asistente.
joined={} se unió a la conversación.
left={} dejó la conversación; el asistente sigue contigo.
closed=La conversación se cerró. Si necesitas algo más, escríbenos de nuevo.
reply-to-confirm=Para hacerlo, responde a este correo con la palabra CONFIRMAR. Para dejarlo, responde CANCELAR.
subject=Tu consulta
