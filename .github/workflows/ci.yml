name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit, architecture and integration tests; Testcontainers uses the runner's preinstalled Docker
      - name: Build and test
        run: ./mvnw -B verify

      # The offline answer quality evaluation runs with the tests above; its table goes to the run summary
      - name: Answer quality report
        if: always()
        run: |
          if [ -f target/eval/answer-quality.md ]; then cat target/eval/answer-quality.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload module documentation
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: spring-modulith-docs
          path: backend/target/spring-modulith-docs

  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - run: npm ci
      - run: npm test
      # Type check, bundle and fail if widget.js grows past its 32 KB budget
      - run: npm run build

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - run: npm ci
      # The panel's API types come from docs/openapi.json, which the backend's tests keep in step with the API
      - name: API types match docs/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/openapi.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The panel, the widget and the backend together in a real browser: sign up, teach, answer, hand off
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, widget, panel]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            panel/package-lock.json
            widget/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix panel
          npm ci --prefix widget
          npm ci --prefix e2e
          cd e2e && npx playwright install --with-deps chromium

      # Playwright starts the backend (dev profile: database from docker-compose.yml, offline model), the panel and
      # the widget's test page itself
      - name: End-to-end flows
        working-directory: e2e
        run: npm test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  backend-image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t support-chat-platform:ci backend
