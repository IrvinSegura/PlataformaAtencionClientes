name: deploy

# Builds the arm64 images, publishes them to GitHub's registry and rolls them out on the Oracle Cloud VM over SSH.
# Runs after a green ci on main, or by hand (also to go back to an image already built). Set up once, see the README
# section "Despliegue en Oracle Cloud":
#   secrets    DEPLOY_HOST, DEPLOY_SSH_KEY (private key of the VM's deploy user), DEPLOY_KNOWN_HOSTS (ssh-keyscan)
#   variable   PUBLIC_DOMAIN (e.g. mysupport.duckdns.org)
# Until PUBLIC_DOMAIN exists the run after ci is skipped instead of failing; a manual run still fails and says why.
# The application's secrets never pass through GitHub: they live in /opt/supportchat/.env on the VM.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Deploy this already built tag (a commit's first 12 characters) instead of building; for rollbacks
        required: false
        default: ""

# One rollout at a time, and none is cut short by the next
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
          && vars.PUBLIC_DOMAIN != '')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit ci tested, not whatever main points at now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Names
        id: names
        env:
          DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
        run: |
          test -n "$DOMAIN" || { echo "::error::Set the repository variable PUBLIC_DOMAIN"; exit 1; }
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          # Registry names must be lowercase
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/support-chat" >> "$GITHUB_OUTPUT"

      # Only the last layers run emulated: both Dockerfiles compile on the runner's own platform
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-backend:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.prefix }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image (Caddy, panel and widget)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: DOMAIN=${{ vars.PUBLIC_DOMAIN }}
          tags: |
            ${{ steps.names.outputs.prefix }}-web:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.prefix }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    # Also when images was skipped because a tag to roll back to was given
    if: >-
      always()
      && (needs.images.result == 'success'
          || (needs.images.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.PUBLIC_DOMAIN }}
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      TAG: ${{ inputs.image_tag || needs.images.outputs.tag }}
      DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: SSH access
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host keys: a server that answers with another key is not ours
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vm\n  HostName %s\n  User deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$HOST" > ~/.ssh/config

      - name: Copy compose, scripts and collector configuration
        # .env and secrets/ on the VM are left alone
        run: |
          tar -czf - -C deploy docker-compose.yml scripts systemd postgres/init monitoring/alloy \
            | ssh vm 'tar -xzf - -C /opt/supportchat && chmod +x /opt/supportchat/scripts/*.sh'

      - name: Roll out
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job's token pulls the images and expires with the job; nothing long-lived stays on the VM
          printf '%s' "$REGISTRY_TOKEN" | ssh vm "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh vm "set -e
            cd /opt/supportchat
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env
            grep -q '^IMAGE_TAG=' .env || echo 'IMAGE_TAG=$TAG' >> .env
            docker compose pull --quiet
            status=0
            docker compose up -d --remove-orphans --wait --wait-timeout 300 || status=\$?
            docker logout ghcr.io
            docker image prune -f > /dev/null
            if [ \$status -ne 0 ]; then docker compose ps; docker compose logs --tail 80 backend; fi
            exit \$status"

      - name: Smoke test
        run: |
          # The panel loads and the API answers (401 without a token means the backend is up behind Caddy)
          for attempt in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/api/v1/me" || true)
            if [ "$api" = "401" ] && curl -fsS -o /dev/null "https://$DOMAIN/" && curl -fsS -o /dev/null "https://$DOMAIN/widget.js"; then
              echo "Deployed $TAG to https://$DOMAIN"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$DOMAIN did not answer as expected (API: $api)"
          exit 1
